name: Build Football Fun

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: footballfun-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa-and-build:
    name: QA + Build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate FootballFun ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/FootballFun.zip"

          test -f "$ZIP"

          echo "ZIP size:"
          ls -lh "$ZIP"

          echo "Testing ZIP integrity..."
          unzip -t "$ZIP" >/dev/null

          echo "ZIP integrity: PASS"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$GITHUB_WORKSPACE/FootballFun.zip" \
            -d "$GITHUB_WORKSPACE/extracted"

          PROJECT_DIR="$GITHUB_WORKSPACE/extracted/FootballFun"

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project structure: PASS"

      - name: Show version
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "Football Fun version:"
          grep -E "versionCode|versionName" app/build.gradle || true

      - name: Clean project
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            clean

      - name: Compile Debug
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            compileDebugJavaWithJavac

      - name: Run unit tests
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            testDebugUnitTest

      - name: Run Android Lint
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            lintDebug

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Build Release AAB
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            bundleRelease

      - name: Collect outputs
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name '*.apk' | head -n 1)"

          AAB="$(find "$PROJECT_DIR/app/build/outputs/bundle" \
            -type f -name '*.aab' | head -n 1)"

          test -n "$APK"
          test -f "$APK"

          test -n "$AAB"
          test -f "$AAB"

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/output/FootballFun-debug.apk"

          cp "$AAB" \
            "$GITHUB_WORKSPACE/output/FootballFun-release.aab"

          if [ -d "$PROJECT_DIR/app/build/reports" ]; then
            cp -r "$PROJECT_DIR/app/build/reports" \
              "$GITHUB_WORKSPACE/output/QA-reports"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FootballFun-APK
          path: output/FootballFun-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: FootballFun-AAB
          path: output/FootballFun-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FootballFun-QA-Reports
          path: output/QA-reports
          if-no-files-found: ignore
          retention-days: 30
