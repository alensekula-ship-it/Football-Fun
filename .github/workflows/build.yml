name: Football Fun Release QA + Signed AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: footballfun-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install QA dependencies
        run: python -m pip install --disable-pip-version-check pillow

      - name: Extract FootballFun.zip
        shell: bash
        run: |
          set -euo pipefail

          test -f "$GITHUB_WORKSPACE/FootballFun.zip"

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$GITHUB_WORKSPACE/FootballFun.zip" \
            -d "$GITHUB_WORKSPACE/extracted"

          PROJECT_DIR="$GITHUB_WORKSPACE/extracted/FootballFun"

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # IMPORTANT:
      # QA checks the exact source ZIP.
      # No automatic source-code modifications are allowed here.
      - name: Football Fun custom QA
        run: python footballfun_qa.py "$PROJECT_DIR"

      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon clean

      - name: Compile Debug
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace --warning-mode all compileDebugJavaWithJavac

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Run Android Lint
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace lintDebug

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Validate release signing secrets
        shell: bash
        env:
          FOOTBALL_FUN_KEYSTORE_BASE64: ${{ secrets.FOOTBALL_FUN_KEYSTORE_BASE64 }}
          FOOTBALL_FUN_KEYSTORE_PASSWORD: ${{ secrets.FOOTBALL_FUN_KEYSTORE_PASSWORD }}
          FOOTBALL_FUN_KEY_ALIAS: ${{ secrets.FOOTBALL_FUN_KEY_ALIAS }}
          FOOTBALL_FUN_KEY_PASSWORD: ${{ secrets.FOOTBALL_FUN_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$FOOTBALL_FUN_KEYSTORE_BASE64" ]; then
            echo "ERROR: FOOTBALL_FUN_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [ -z "$FOOTBALL_FUN_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: FOOTBALL_FUN_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$FOOTBALL_FUN_KEY_ALIAS" ]; then
            echo "ERROR: FOOTBALL_FUN_KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "$FOOTBALL_FUN_KEY_PASSWORD" ]; then
            echo "ERROR: FOOTBALL_FUN_KEY_PASSWORD secret is missing."
            exit 1
          fi

          echo "Release signing secrets are configured."

      - name: Prepare release keystore
        shell: bash
        env:
          FOOTBALL_FUN_KEYSTORE_BASE64: ${{ secrets.FOOTBALL_FUN_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$RUNNER_TEMP/footballfun-release.jks"

          printf '%s' "$FOOTBALL_FUN_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$KEYSTORE_PATH"

          test -s "$KEYSTORE_PATH"

          chmod 600 "$KEYSTORE_PATH"

          echo "FOOTBALL_FUN_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build Signed Release AAB
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          FOOTBALL_FUN_KEYSTORE_PATH: ${{ env.FOOTBALL_FUN_KEYSTORE_PATH }}
          FOOTBALL_FUN_KEYSTORE_PASSWORD: ${{ secrets.FOOTBALL_FUN_KEYSTORE_PASSWORD }}
          FOOTBALL_FUN_KEY_ALIAS: ${{ secrets.FOOTBALL_FUN_KEY_ALIAS }}
          FOOTBALL_FUN_KEY_PASSWORD: ${{ secrets.FOOTBALL_FUN_KEY_PASSWORD }}
        run: |
          gradle --no-daemon --stacktrace bundleRelease

      - name: Verify signed AAB
        shell: bash
        run: |
          set -euo pipefail

          AAB="$(find "$PROJECT_DIR/app/build/outputs/bundle" \
            -type f \
            -name '*.aab' \
            | head -n 1)"

          test -n "$AAB"
          test -f "$AAB"

          jarsigner -verify "$AAB"

          echo "Signed AAB verification successful."

      - name: Collect outputs
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          AAB="$(find "$PROJECT_DIR/app/build/outputs/bundle" \
            -type f \
            -name '*.aab' \
            | head -n 1)"

          test -n "$APK"
          test -f "$APK"

          test -n "$AAB"
          test -f "$AAB"

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/output/FootballFun-debug.apk"

          cp "$AAB" \
            "$GITHUB_WORKSPACE/output/FootballFun-release.aab"

          cd "$GITHUB_WORKSPACE/extracted"

          zip -qr \
            "$GITHUB_WORKSPACE/output/FootballFun-Verified-Source.zip" \
            FootballFun

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FootballFun-APK
          path: output/FootballFun-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Signed Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: FootballFun-AAB
          path: output/FootballFun-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload Verified Source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: FootballFun-Verified-Source
          path: output/FootballFun-Verified-Source.zip
          if-no-files-found: error
          retention-days: 30

      - name: Remove release keystore
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/footballfun-release.jks"
